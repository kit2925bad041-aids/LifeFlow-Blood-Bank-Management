<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeFlow | Register Donor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="dashboard.html">🩸 LifeFlow</a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="register.html">Register</a>
        <a href="search.html">Search</a>
        <a href="stock.html">Stock</a>
        <a href="request.html">Request</a>
        <a href="logout">Logout</a>
      </nav>
    </header>

    <section class="section light" id="donor">
      <div class="eyebrow">DONOR REGISTRATION</div>
      <h2>Register a Donor</h2>

      <form id="donorForm" class="form-card">
        <input name="name" placeholder="Full Name" required />

        <input
          name="age"
          type="number"
          min="18"
          max="65"
          placeholder="Age (18–65)"
          required
        />

        <select name="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <select name="bloodGroup" required>
          <option value="">Select Blood Group</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>O+</option>
          <option>O-</option>
          <option>AB+</option>
          <option>AB-</option>
        </select>

        <input name="phone" type="tel" placeholder="Phone Number" required />

        <button class="btn" type="submit">Register Donor</button>
        <p id="donorMsg" class="message"></p>
      </form>
    </section>

    <footer>LifeFlow Blood Bank · Java Servlet + JDBC + MySQL</footer>

    <script>
      const form = document.getElementById("donorForm");
      const message = document.getElementById("donorMsg");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "Registering...";

        try {
          const response = await fetch("donor", {
            method: "POST",
            body: new URLSearchParams(new FormData(form)),
          });

          const result = await response.json();
          message.textContent = result.message;

          if (result.success) {
            form.reset();
          }
        } catch (error) {
          message.textContent = "Registration failed. Please try again.";
        }
      });
    </script>
  </body>
</html>
